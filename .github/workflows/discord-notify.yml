name: 📢 Notificação Discord

on:
  push:
    branches: [main, develop]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Buscar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📋 Preparar mensagem
        id: prep
        run: |
          # Buscar mensagem do commit
          COMMIT_MSG=$(git log -1 --pretty=format:%s)
          
          # Buscar primeiros 5 ficheiros alterados
          FILES=$(git diff --name-only HEAD~1 HEAD | head -5 | sed 's/^/• `/;s/$/`\n/')
          
          # Contar total de ficheiros
          TOTAL_FILES=$(git diff --name-only HEAD~1 HEAD | wc -l)
          
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT

      - name: 💬 Enviar para o Discord
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "🍦 **Projeto Iogurtes** - Novo push!"
          embed-description: |
            **👤 Quem:** `${{ github.actor }}`
            **🌿 Branch:** `${{ github.ref_name }}`
            **💬 Mensagem:** 
